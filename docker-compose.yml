version: "3.9"

services:
  dashboard:
    build: ./services/dashboard
    ports:
      - "8000:8000"
    environment:
      - GODSEYE_MODE=monitor_only
    volumes:
      - ./logs:/app/logs

  suricata:
    image: jasonish/suricata:latest
    command: -c /etc/suricata/suricata.yaml -i eth0
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./configs/suricata:/etc/suricata
      - ./logs:/var/log/suricata
